<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>exo2</title>
  </head>
  <body>
    <section id="login-view">
      <div id="login-top-bar"></div>
      <div id="login-content">
        <div id="login-content-left">
          <img src="/windows_xp_logo.png" alt="" />
          <p>Pour commencer, cliquez sur votre nom d'utilisateur</p>
        </div>
        <div id="login-content-right">
          <div id="login-content-button">
            <img src="/admin_avatar.jpg" alt="" />
            <p>Administrateur</p>
          </div>
        </div>
      </div>
      <div id="login-bottom-bar"></div>
    </section>

    <section id="main-view" class="hidden">
      <div id="player-logo-button">
        <img src="/player.png" alt="" />
        <p>Musique</p>
      </div>

      <div id="myWindow" class="window hidden">
        <div class="window-top">
          <button class="round green"></button
          ><button class="round yellow"></button
          ><button class="round red"></button>
        </div>
        <div class="window-content">
          <button id="play-button">Play</button>
          <canvas>
            <audio>
              <source src="/audio.mp3" type="audio/mpeg" />
            </audio>
          </canvas>
      </div>

    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
